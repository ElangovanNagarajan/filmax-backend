name: diag-bms
# TEMPORARY — delete after diagnosis. Separate concurrency group so it runs
# alongside the live watcher instead of queueing behind it.
on:
  push:
    paths: ['scripts/diag-bms.mjs', '.github/workflows/diag.yml']
concurrency:
  group: diag-bms
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: node scripts/diag-bms.mjs
